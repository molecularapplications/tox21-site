name: Update leaderboard data

on:
  schedule:
    - cron: "30 2 * * *"   # daily at 02:30 UTC, just after the leaderboard's own refresh
  workflow_dispatch: {}      # adds a "Run workflow" button for manual/first runs

permissions:
  contents: write            # lets the action commit data.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "datasets>=2.0.0"

      - name: Fetch leaderboard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # only needed if the dataset is gated; harmless if unset
        run: python scripts/fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data.json)" ]; then
            git add data.json
            git commit -m "data: refresh leaderboard ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No change to data.json."
          fi
